<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Faizan Ali — Full Stack Developer, Bengaluru, India">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#090c15"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="299" rx="12" fill="url(#bg)" stroke="#283040"/>

  <!-- name -->
  <text x="54" y="100" font-size="56" font-weight="800" letter-spacing="-1.5" fill="#e6edf3">Faizan Ali</text>

  <!-- role · location -->
  <text x="56" y="136" font-size="18" font-weight="600" fill="#e6edf3" xml:space="preserve">Full Stack Developer <tspan fill="#56d364">·</tspan> Bengaluru, India</text>

  <!-- focus statement -->
  <text x="56" y="166" font-size="16" fill="#8b949e">Fast, type-safe web apps — increasingly with LLMs wired into real product workflows.</text>

  <!-- accent rule -->
  <rect x="56" y="194" width="40" height="2" fill="#56d364"/>
  <line x1="104" y1="195" x2="844" y2="195" stroke="#283040"/>

  <!-- metadata -->
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2.2" fill="#6e7681">
    <text x="56" y="234">FOCUS</text>
    <text x="356" y="234">OPEN TO</text>
  </g>
  <g font-size="15.5" fill="#e6edf3">
    <text x="56" y="258">LLM-integrated products</text>
    <text x="356" y="258" xml:space="preserve">Collabs <tspan fill="#6e7681">·</tspan> Full-time roles</text>
  </g>
</svg>
