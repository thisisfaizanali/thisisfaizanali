<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Faizan Ali, Full Stack Developer in Bengaluru, India. Open to full-time roles and collabs. Building LLM-integrated products; learning system design and AI agents.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141518"/><stop offset="1" stop-color="#0d0e10"/></linearGradient><radialGradient id="ga" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ff5a5f" stop-opacity="0.2"/><stop offset="1" stop-color="#ff5a5f" stop-opacity="0"/></radialGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.09"/></pattern><linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient><mask id="m"><rect x="250" y="0" width="302" height="340" fill="url(#fade)"/></mask>
  </defs>
  <rect x="0.5" y="0.5" width="551" height="339" rx="18" fill="url(#bg)" stroke="#26282d"/><rect x="1" y="1" width="550" height="338" rx="17" fill="url(#ga)"/>
  <rect x="250" y="1" width="301" height="338" rx="17" fill="url(#dots)" mask="url(#m)"/>
  <text x="40" y="60" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#ff5a5f">FULL STACK DEVELOPER</text>
  <text x="37" y="138" font-size="68" font-weight="800" letter-spacing="-2.2" fill="#f2f3f5">Faizan Ali</text>
  <text font-size="16.5" fill="#9499a3">
    <tspan x="40" y="184">I build fast, type-safe web apps with clean architecture</tspan>
    <tspan x="40" y="209">and sharp UX, with LLMs wired into real product workflows.</tspan>
  </text>
  <rect x="40.5" y="262.5" width="285" height="37" rx="18.5" fill="#3fb950" fill-opacity="0.09" stroke="#3fb950" stroke-opacity="0.35"/>
  <circle cx="60" cy="281" r="4" fill="#3fb950"/>
  <circle cx="60" cy="281" r="4" fill="none" stroke="#3fb950"><animate attributeName="r" values="4;10" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="76" y="286" font-size="14" font-weight="600" fill="#f2f3f5">Open to full-time roles and collabs</text>

  <rect x="576.5" y="0.5" width="323" height="157" rx="18" fill="url(#bg)" stroke="#26282d"/>
  <text x="604" y="46" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#636872">BASED IN</text>
  <text x="603" y="92" font-size="32" font-weight="700" letter-spacing="-0.6" fill="#f2f3f5">Bengaluru</text>
  <text x="604" y="120" font-size="15" fill="#9499a3">India · UTC+5:30</text>
  <g fill="none" stroke="#ff5a5f">
    <circle cx="846" cy="80" r="42" stroke-opacity="0.12"/>
    <circle cx="846" cy="80" r="28" stroke-opacity="0.22"/>
    <circle cx="846" cy="80" r="14" stroke-opacity="0.4"/>
  </g>
  <circle cx="846" cy="80" r="5" fill="#ff5a5f"/>

  <rect x="576.5" y="182.5" width="323" height="157" rx="18" fill="url(#bg)" stroke="#26282d"/>
  <text x="604" y="228" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#636872">NOW</text>
  <text x="604" y="264" font-size="13" fill="#636872">Building</text>
  <text x="684" y="264" font-size="15" font-weight="600" fill="#f2f3f5">LLM-integrated products</text>
  <line x1="604" y1="280.5" x2="872" y2="280.5" stroke="#26282d"/>
  <text x="604" y="306" font-size="13" fill="#636872">Learning</text>
  <text x="684" y="306" font-size="15" font-weight="600" fill="#f2f3f5">System design, AI agents</text>
